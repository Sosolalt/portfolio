name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The gh-pages branch is the published source, so the token needs to write it.
permissions:
  contents: write

# A single in-flight deployment; queue the next one rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        # Tells vite.config.ts to emit asset URLs under the /portfolio/ sub-path.
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      - name: Publish to gh-pages
        # A fresh single-commit history each time, so the branch never accumulates
        # build output. .nojekyll stops Pages from running the files through Jekyll.
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
